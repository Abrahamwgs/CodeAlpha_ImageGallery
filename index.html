<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image Gallery</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="background-glow"></div>

  <h1>Image Gallery</h1>

  <div class="filters">
    <button class="active" data-filter="all">All</button>
    <button data-filter="nature">Nature</button>
    <button data-filter="tech">Tech</button>
    <button data-filter="cars">Cars</button>
  </div>

  <div class="gallery">

    <div class="image nature">
      <img src="images/nature1.jpg" alt="">
      <div class="caption">Beautiful Nature</div>
    </div>

    <div class="image tech">
      <img src="images/tech1.jpg" alt="">
      <div class="caption">Modern Technology</div>
    </div>

    <div class="image cars">
      <img src="images/car1.jpg" alt="">
      <div class="caption">Luxury Cars</div>
    </div>

    <div class="image nature">
      <img src="images/nature2.jpg" alt="">
      <div class="caption">Mountain View</div>
    </div>

  </div>

  <div class="lightbox">

    <span class="close">&times;</span>

    <span class="prev">&#10094;</span>
    <img class="lightbox-img" src="">
    <span class="next">&#10095;</span>

    <div class="lightbox-caption"></div>

  </div>

  <script src="script.js"></script>

</body>
</html>
